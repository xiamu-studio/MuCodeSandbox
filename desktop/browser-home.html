<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://ipinfo.io https://api.ipify.org; img-src data:; base-uri 'none'; form-action https: http:">
<title>MuCodeSandbox · 首页</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(at 0 0,#dcefe7,transparent 55%),radial-gradient(at 100% 0,#e8e8f5,transparent 50%),#eef3f4;color:#24454c;font:15px/1.6 'Noto Sans CJK SC','Arial',sans-serif;min-height:100vh}main{max-width:1040px;margin:auto;padding:50px 40px}header{display:flex;align-items:center;gap:15px;margin-bottom:34px}.mark{width:49px;height:49px;background:#226e63;color:white;display:grid;place-items:center;border-radius:15px;font-size:24px}h1{font-size:26px;line-height:1.3;margin:0}p{margin:7px 0;color:#668187}.eyebrow{font-size:12px;color:#518279;letter-spacing:1px;margin:0 0 7px}.address{display:flex;gap:12px;margin:0 0 28px}input{flex:1;min-width:0;border:1px solid #ccdddf;background:#fffffff0;border-radius:14px;padding:15px 19px;color:#254950;font:inherit}input:focus{outline:2px solid #7aac9f}button{border:1px solid #cbdfdc;border-radius:12px;background:#fff;color:#35665f;font:inherit;cursor:pointer;padding:10px 16px}button.primary{background:#226e63;border-color:#226e63;color:white;padding:13px 23px;font-weight:600}button:disabled{opacity:.55;cursor:wait}.cards{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{padding:26px;border:1px solid white;background:#ffffffde;border-radius:22px;box-shadow:0 10px 35px #284b5708}h2{font-size:17px;margin:0 0 18px}.card-heading{display:flex;align-items:center;justify-content:space-between;gap:15px}.card-heading button{font-size:12px;padding:6px 10px}.ip{font:600 31px/1.3 monospace;color:#205a51;overflow-wrap:anywhere;margin:13px 0 10px}.location{font-size:16px;color:#4c746f}.state{font-size:12px;margin-top:15px}.state.error{color:#a8553c}.state.ok{color:#387665}.state.checking{color:#64818a}.facts{display:grid;gap:15px}.fact{display:flex;justify-content:space-between;gap:15px;padding-bottom:12px;border-bottom:1px solid #e2ecec}.fact span{font-size:12px;color:#6c8288}.fact strong{font-size:13px;font-weight:500;text-align:right;overflow-wrap:anywhere}.footer{margin:25px 3px;font-size:12px;color:#758c91}.form-error{color:#a8553c;font-size:12px;min-height:18px;margin:-19px 0 20px}.hint{margin:0 0 18px;font-size:13px;color:#668187}@media(max-width:650px){main{padding:30px 20px}.cards{grid-template-columns:1fr}h1{font-size:22px}.address{gap:8px}.address button{padding:12px 16px}.ip{font-size:26px}}
</style></head><body><main>
<header><div class="mark">⌘</div><div><p class="eyebrow">MUCODESANDBOX</p><h1>你的浏览器首页</h1><p>查看网络出口，开始浏览网页。</p></div></header>
<form class="address" id="address-form"><input id="address" aria-label="网页地址" placeholder="输入网址，例如 https://www.wikipedia.org" autocomplete="off"><button class="primary" type="submit">打开网页</button></form><p class="form-error" id="address-error" role="alert"></p>
<div class="cards"><section class="card"><div class="card-heading"><h2>当前出口 IP</h2><button id="refresh" type="button">重新检测</button></div><div class="ip" id="ip">正在检测…</div><div class="location" id="location">等待网络回执</div><p class="state checking" id="network-state" role="status">检测请求由当前浏览器发出</p></section>
<section class="card"><h2>当前浏览器环境</h2><div class="facts"><div class="fact"><span>时区</span><strong id="timezone">—</strong></div><div class="fact"><span>语言</span><strong id="language">—</strong></div><div class="fact"><span>系统</span><strong id="platform">—</strong></div></div><p class="footer">以上环境信息读取自当前浏览器。</p></section></div>
<p class="footer">首页保存在本地。IP 查询由 IPinfo / ipify 提供；查询结果不代表全部防泄漏检测。</p>
</main><script>
'use strict';
const el=id=>document.getElementById(id);
el('timezone').textContent=Intl.DateTimeFormat().resolvedOptions().timeZone;
el('language').textContent=navigator.language;
el('platform').textContent=navigator.platform;
document.getElementById('address-form').addEventListener('submit',event=>{
  event.preventDefault();el('address-error').textContent='';
  try{const text=el('address').value.trim();if(!text)throw new Error();
    const url=new URL(/^[a-z][a-z0-9+.-]*:/i.test(text)?text:'https://'+text);
    if(!['http:','https:'].includes(url.protocol)||url.username||url.password)throw new Error();
    location.assign(url.href);
  }catch{el('address-error').textContent='请输入有效的 HTTP 或 HTTPS 网址';}
});
const validIP=ip=>typeof ip==='string'&&((/^\d{1,3}(\.\d{1,3}){3}$/.test(ip)&&ip.split('.').every(n=>Number(n)<=255))||(/^[a-f0-9:]{2,45}$/i.test(ip)&&ip.includes(':')));
async function receive(url){const response=await fetch(url,{signal:AbortSignal.timeout(6500),credentials:'omit',cache:'no-store',referrerPolicy:'no-referrer'});if(!response.ok)throw new Error();const data=await response.json();if(!validIP(data.ip))throw new Error();return data;}
let busy=false;
async function check(){
  if(busy)return;busy=true;el('refresh').disabled=true;
  el('ip').textContent='正在检测…';el('location').textContent='等待网络回执';
  el('network-state').className='state checking';el('network-state').textContent='正在检查当前浏览器的实际出口';
  try{
    let data,provider;try{data=await receive('https://ipinfo.io/json');provider='IPinfo';}catch{data=await receive('https://api.ipify.org?format=json');provider='ipify';}
    el('ip').textContent=data.ip;
    let country=data.country;if(typeof country==='string'&&/^[A-Z]{2}$/.test(country))country=new Intl.DisplayNames(['zh-CN'],{type:'region'}).of(country);
    el('location').textContent=[country,data.city].filter(v=>typeof v==='string').map(v=>v.slice(0,100)).join(' · ')||'地区信息暂时不可用';
    el('network-state').className='state ok';el('network-state').textContent='检测成功 · '+provider+' · '+new Date().toLocaleTimeString('zh-CN');
  }catch{el('ip').textContent='暂时无法检测';el('location').textContent='请检查线路后重试';el('network-state').className='state error';el('network-state').textContent='没有取得有效出口回执，请重新检测';}
  finally{busy=false;el('refresh').disabled=false;}
}
el('refresh').addEventListener('click',check);check();
</script></body></html>
