<!doctype html><meta charset="utf-8"><title>MuCodeSandbox drawing diagnostic</title>
<style>body{margin:0;font:18px system-ui;color:#193b41;background:#f3f6f7}header{position:fixed;z-index:2;inset:0 0 auto;background:#fff;padding:20px 40px;box-shadow:0 2px 5px #1232}h1{font-size:25px;margin:0 0 8px}button{font:inherit;padding:12px 24px;border:0;border-radius:9px;background:#1b746c;color:#fff}main{padding:180px 40px 30px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{padding:22px;border-radius:14px;background:white;box-shadow:0 3px 10px #1231}.card i{display:block;height:50px;background:linear-gradient(105deg,#c4e6de,#d0d9ec);border-radius:7px}.card p{line-height:1.5}#results{display:none;position:fixed;z-index:3;inset:140px 50px auto;padding:30px;background:white;border:2px solid #1b746c;border-radius:15px;white-space:pre-wrap;font:23px monospace}</style>
<header><h1>Local drawing diagnostic · no external requests</h1><span id="status">200 cards · scroll/layout and text updates · 12 seconds</span> <button id="start">Run diagnostic</button></header><main id="cards"></main><div id="results"></div>
<script>
for(let i=0;i<200;i++){const e=document.createElement('section');e.className='card';e.innerHTML='<i></i><h2>Document '+(i+1)+'</h2><p>Local rendering workload. Independent browser drawing measurement with no accounts, network requests, or storage.</p><span class="counter">Ready</span>';cards.appendChild(e)}
start.onclick=()=>{start.disabled=true;status.textContent='Running…';const deltas=[],counters=[...document.querySelectorAll('.counter')];let begin=0,last=0,n=0,longCount=0,longMs=0;const observer=new PerformanceObserver(list=>{for(const e of list.getEntries()){longCount++;longMs+=e.duration}});observer.observe({type:'longtask'});
function frame(t){if(!begin){begin=t;last=t} else deltas.push(t-last);last=t;n++;window.scrollTo(0,(t-begin)*.35%(document.body.scrollHeight-innerHeight));for(let i=0;i<8;i++)counters[(n+i)%200].textContent='Update '+n;if(t-begin<12000){requestAnimationFrame(frame);return}observer.disconnect();const sorted=deltas.slice().sort((a,b)=>a-b),elapsed=t-begin;window.scrollTo(0,0);document.getElementById('status').textContent='Completed; this measures browser frame scheduling, not pointer-to-screen delay.';results.style.display='block';results.textContent=JSON.stringify({elapsedMs:Math.round(elapsed),frames:deltas.length,averageFps:Number((deltas.length*1000/elapsed).toFixed(1)),medianFrameMs:Number(sorted[Math.floor(sorted.length*.5)].toFixed(1)),p95FrameMs:Number(sorted[Math.floor(sorted.length*.95)].toFixed(1)),framesOver50ms:sorted.filter(v=>v>50).length,longTasks:longCount,longTaskMs:Math.round(longMs),screen:[screen.width,screen.height],viewport:[innerWidth,innerHeight],dpr:devicePixelRatio},null,2)}requestAnimationFrame(frame)};
</script>
